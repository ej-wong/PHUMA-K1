root_pos: [0.0000, 0.0000, 0.5519]
root_ori: [0.0000, 0.0000, 0.0000, 1.0000]
# Horizontal root-travel scale = robot_leg / captured_human_leg.
# Shrinks the reference path so this sub-human-size robot doesn't over-stride/slide.
# NOTE: this is SUBJECT-dependent (depends on the captured human's leg length).
# This value targets the 'turning_joe_2' subject (real leg 0.989 m from betas).
# Override per-dataset with --root_scale on the retarget scripts for other subjects.
root_scale: 0.415 # k1 leg (0.411) / Joe leg (0.989); SMPL-neutral subject would be 0.44
dof_pos: [
  # Head: yaw, pitch
  0.0000,  0.0000,
  # Left Arm: shoulder_pitch, shoulder_roll, elbow_pitch, elbow_yaw
  0.7582, -0.1248, -2.2700,  0.0000,
  # Right Arm: shoulder_pitch, shoulder_roll, elbow_pitch, elbow_yaw
  0.7582,  0.1248,  2.2700,  0.0000,
  # Left Leg: hip_pitch, hip_roll, hip_yaw, knee, ankle_pitch, ankle_roll
  0.0000,  0.0000,  0.0000,  0.0000,  0.0000,  0.0000,
  # Right Leg: hip_pitch, hip_roll, hip_yaw, knee, ankle_pitch, ankle_roll
  0.0000,  0.0000,  0.0000,  0.0000,  0.0000,  0.0000
]

