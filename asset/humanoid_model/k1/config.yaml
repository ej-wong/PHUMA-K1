root_pos: [0.0000, 0.0000, 0.5519]
root_ori: [0.0000, 0.0000, 0.0000, 1.0000]
# K1's leg length (hip->knee->ankle->foot, T-pose). Used to AUTO-compute
# root_scale per dataset as robot_leg_length / mean_human_leg, where the human
# leg is measured from the dataset's GVHMR .pt betas (cached). See resolve_root_scale.
robot_leg_length: 0.411
# Fallback root_scale, used only if auto-compute can't run (no .pt/betas for the
# dataset) AND --root_scale isn't passed. Auto-compute is preferred.
# = robot_leg / captured_human_leg; shrinks the path so this sub-human-size robot
# doesn't over-stride/slide. 0.415 targets turning_joe_2 (human leg 0.989 m).
root_scale: 0.415
dof_pos: [
  # Head: yaw, pitch
  0.0000,  0.0000,
  # Left Arm: shoulder_pitch, shoulder_roll, elbow_pitch, elbow_yaw
  0.7582, -0.1248, -2.2700,  0.0000,
  # Right Arm: shoulder_pitch, shoulder_roll, elbow_pitch, elbow_yaw
  0.7582,  0.1248,  2.2700,  0.0000,
  # Left Leg: hip_pitch, hip_roll, hip_yaw, knee, ankle_pitch, ankle_roll
  0.0000,  0.0000,  0.0000,  0.0000,  0.0000,  0.0000,
  # Right Leg: hip_pitch, hip_roll, hip_yaw, knee, ankle_pitch, ankle_roll
  0.0000,  0.0000,  0.0000,  0.0000,  0.0000,  0.0000
]

bone_mapping:
  # Left Leg
  - ['pelvis', 'left_hip', 'Trunk', 'Left_Hip_Roll']
  - ['left_hip', 'left_knee', 'Left_Hip_Roll', 'Left_Shank']
  - ['left_knee', 'left_ankle', 'Left_Shank', 'Left_Ankle_Cross']
  # Right Leg
  - ['pelvis', 'right_hip', 'Trunk', 'Right_Hip_Roll']
  - ['right_hip', 'right_knee', 'Right_Hip_Roll', 'Right_Shank']
  - ['right_knee', 'right_ankle', 'Right_Shank', 'Right_Ankle_Cross']
  # Left Arm (upper arm = shoulder->elbow; forearm = elbow->wrist, driven by elbow flexion)
  - ['pelvis', 'left_shoulder', 'Trunk', 'Left_Arm_2']
  - ['left_shoulder', 'left_elbow', 'Left_Arm_2', 'left_hand_link']
  - ['left_elbow', 'left_wrist', 'left_hand_link', 'left_hand_keypoint']
  # Right Arm
  - ['pelvis', 'right_shoulder', 'Trunk', 'Right_Arm_2']
  - ['right_shoulder', 'right_elbow', 'Right_Arm_2', 'right_hand_link']
  - ['right_elbow', 'right_wrist', 'right_hand_link', 'right_hand_keypoint']

keypoints:
  - { name: 'pelvis',                  body: 'Trunk',               }
  - { name: 'left_hip_keypoint',       body: 'Left_Hip_Roll',       }
  - { name: 'left_knee_keypoint',      body: 'Left_Shank',          }
  - { name: 'left_ankle_keypoint',     body: 'Left_Ankle_Cross',    }
  - { name: 'left_heel_keypoint',      body: 'left_heel_keypoint',  }
  - { name: 'left_toe_keypoint',       body: 'left_toe_keypoint',   }
  - { name: 'right_hip_keypoint',      body: 'Right_Hip_Roll',      }
  - { name: 'right_knee_keypoint',     body: 'Right_Shank',         }
  - { name: 'right_ankle_keypoint',    body: 'Right_Ankle_Cross',   }
  - { name: 'right_heel_keypoint',     body: 'right_heel_keypoint', }
  - { name: 'right_toe_keypoint',      body: 'right_toe_keypoint',  }
  - { name: 'torso_keypoint',          body: 'Trunk',               }
  - { name: 'left_shoulder_keypoint',  body: 'Left_Arm_2',          }
  - { name: 'left_elbow_keypoint',     body: 'left_hand_link',      }  # elbow flexion joint (model name: Left_Elbow_Yaw)
  - { name: 'left_wrist_keypoint',     body: 'left_hand_keypoint',  }  # end of forearm; moves with elbow flexion
  - { name: 'right_shoulder_keypoint', body: 'Right_Arm_2',         }
  - { name: 'right_elbow_keypoint',    body: 'right_hand_link',     }  # elbow flexion joint (model name: Right_Elbow_Yaw)
  - { name: 'right_wrist_keypoint',    body: 'right_hand_keypoint', }  # end of forearm; moves with elbow flexion

